<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 36" width="90" height="36" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="along" gradientUnits="userSpaceOnUse" x1="3" y1="0" x2="82" y2="0">
      <stop offset="0" stop-color="#f3bf96"/><stop offset=".25" stop-color="#dc8f5d"/>
      <stop offset=".7" stop-color="#b0623a"/><stop offset="1" stop-color="#3f1f10"/>
    </linearGradient>
    <linearGradient id="gloss" gradientUnits="userSpaceOnUse" x1="3" y1="0" x2="82" y2="0">
      <stop offset="0" stop-color="#fff4e6" stop-opacity=".95"/><stop offset=".6" stop-color="#ffe3c8" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <clipPath id="onCover"><rect x="56" y="0" width="34" height="36"/></clipPath>
  </defs>
  <!-- sombra proyectada sobre la portada -->
  <g clip-path="url(#onCover)">
    <path d="M82 14 H8 A4 4 0 0 0 8 22 H82" transform="translate(1.5 3)" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="3.8" filter="url(#blur)"/>
  </g>
  <!-- contorno / cara inferior del tubo -->
  <path d="M82 14 H8 A4 4 0 0 0 8 22 H82" fill="none" stroke="#3a1c0e" stroke-width="4.8"/>
  <!-- cuerpo metálico -->
  <path d="M82 14 H8 A4 4 0 0 0 8 22 H82" fill="none" stroke="url(#along)" stroke-width="3.6"/>
  <!-- luz especular -->
  <path d="M82 14 H8 A4 4 0 0 0 8 22 H82" transform="translate(0 -.9)" fill="none" stroke="url(#gloss)" stroke-width="1"/>
  <!-- reflejo de rebote -->
  <path d="M60 14 H8 A4 4 0 0 0 8 22 H60" transform="translate(0 1.2)" fill="none" stroke="#ffd2ac" stroke-opacity=".28" stroke-width=".7"/>
</svg>
