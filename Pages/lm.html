<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>LM notes: Index</title>
	<link rel="stylesheet" href="../CSS/lm-style.css">
	<script src="JS/lm-script.js" defer></script>
</head>
<body>
	<h1> Libro de apuntes: Lenguaje de Marcas</h1>

	<section id="centered-container">
		<div id="book-grid"></div> 

		<article id="book">
			<div class="page" id="front-page">
				<div id="portrait-back-face"></div>
				<div class="page-division"></div>
			</div>

			<div class="page" id="back-page">
				<div class="page-division"></div>
			</div>
		</article>
	</section>



	<!----------TEMPLATES------------->
	<template id="tiny-book-template">
		<article class="book-element">
			<div class="tiny-page">
				<div class="page-division"></div>
			</div>
		</article>
	</template>

	<template id="page-template">
		<div class="page">
			<article class="front">
				<iframe class="page-iframe"></iframe>
			</article>
			<article class="back">
				<iframe class="page-iframe"></iframe>
			</article>
		</div>
	</template>
</body>
</html>
